[workspace]
members = [
    "crates/cli",
    "crates/config",
    "crates/controller",
    "crates/diagnostics",
    "crates/domain",
    "crates/host",
    "crates/protocol",
    "crates/supervisor",
    "spikes/tonic-named-pipe",
    "spikes/windows-atomic-replace",
    "spikes/windows-process-lifecycle",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
humantime-serde = "1.1"
hyper-util = { version = "0.1", features = ["tokio"] }
jiff = "0.2"
miette = { version = "7", features = ["fancy"] }
parse-size = "1.1"
rusqlite_migration = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.1"
tonic = "0.14"
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v7"] }
windows = "0.62"
windows-service = "0.8"
zstd = "0.13"
