name: Prepare release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@v4

      - id: release
        name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
          version: 0.3.162
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build release assets
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ fromJSON(steps.release.outputs.releases)[0].tag }}
        run: gh workflow run release.yml --ref "$TAG_NAME" -f tag="$TAG_NAME"

  release-pr:
    name: Create or update release PR
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@v4

      - id: release-pr
        name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          version: 0.3.162
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run CI for release PR
        if: steps.release-pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ fromJSON(steps.release-pr.outputs.pr).head_branch }}
        run: gh workflow run ci.yml --ref "$RELEASE_BRANCH"
