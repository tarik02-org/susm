name: Prepare release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  release:
    name: Publish release
    if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: release v') }}"
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - id: release
        name: Resolve release version
        run: echo "version=$(sed -n 's/^version = \"\([^\"]*\)\"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.release.outputs.version }}
          generate_release_notes: true

      - name: Build release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ steps.release.outputs.version }}
        run: gh workflow run release.yml --ref "$TAG_NAME" -f tag="$TAG_NAME"

  release-pr:
    name: Create or update release PR
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@v4

      - id: release-pr
        name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          version: 0.3.162
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run CI for release PR
        if: steps.release-pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release-pr.outputs.pr }}
        run: gh workflow run ci.yml --ref "$(jq -r .head_branch <<< "$RELEASE_PR")"
