name: Nightly release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: nightly-release-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish nightly release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - id: source
        name: Resolve source CI run
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          run_id="$WORKFLOW_RUN_ID"
          sha="$WORKFLOW_RUN_SHA"

          if [[ -z "$run_id" ]]; then
            source_run="$(
              gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
                -f branch=master \
                -f event=push \
                -f status=success \
                -f per_page=1 \
                --jq '.workflow_runs[0] | [.id, .head_sha] | @tsv'
            )"
            read -r run_id sha <<< "$source_run"
          fi

          if [[ -z "$run_id" || -z "$sha" ]]; then
            echo 'No successful master CI run found' >&2
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: susm-*
          path: artifacts
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - id: release
        name: Resolve nightly version
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          base_version="$(
            sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1
          )"
          date="$(date -u +%Y%m%d)"
          version="$base_version-nightly.$date.$GITHUB_RUN_NUMBER"
          short_sha="${RELEASE_SHA:0:12}"

          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "name=susm nightly $version ($short_sha)" >> "$GITHUB_OUTPUT"

      - name: Publish nightly release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ steps.source.outputs.sha }}
          name: ${{ steps.release.outputs.name }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          files: |
            artifacts/**/*.zip
            artifacts/**/*.sha256
          fail_on_unmatched_files: true
